<style>
.arch-flow{display:flex;flex-direction:column;gap:12px;margin:12px 2px 6px}
.af-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.af-user{font-size:13.5px;color:#5b6880;font-weight:600;white-space:nowrap}
.af-sub{font-size:12px;color:#8b98ad;font-weight:400;white-space:nowrap}
.af-arrow{width:30px;height:2px;border-radius:2px;flex:none;position:relative;
  background:linear-gradient(90deg,#c9d6e6,#2f6feb)}
.af-arrow::after{content:"";position:absolute;right:-2px;top:-3.5px;
  border:4.5px solid transparent;border-left-color:#2f6feb}
.af-arrow.green{background:linear-gradient(90deg,#c9d6e6,#16875d)}
.af-arrow.green::after{border-left-color:#16875d}
.af-chip{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:13px;
  background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(23,32,51,.06),inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .18s ease,box-shadow .18s ease}
.af-chip:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(23,32,51,.10),inset 0 1px 0 rgba(255,255,255,.9)}
.af-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;
  font-size:13px;font-weight:700;flex:none;letter-spacing:0}
.af-t{font-size:13.5px;font-weight:700;color:#172033;line-height:1.3}
.af-s{font-size:11px;color:#67738a;line-height:1.35}
.af-loop{position:relative;border:1.5px dashed rgba(47,111,235,.42);border-radius:16px;
  padding:18px 16px 12px;background:rgba(47,111,235,.05);margin:4px 0}
.af-loop-tag{position:absolute;top:-11px;left:16px;color:#fff;font-size:11px;font-weight:600;
  border-radius:99px;padding:2.5px 13px;letter-spacing:.6px;
  background:linear-gradient(135deg,#2f6feb,#7556d8);box-shadow:0 4px 10px rgba(47,111,235,.30)}
.af-back{margin-top:11px;display:flex;align-items:center;gap:10px;color:#67738a;font-size:11.5px}
.af-back-line{flex:1;border-top:1.5px dashed rgba(47,111,235,.5);position:relative;height:0}
.af-back-line::before{content:"";position:absolute;left:-1px;top:-5px;
  border:4.5px solid transparent;border-bottom-color:rgba(47,111,235,.65)}
.af-note{margin-top:2px;text-align:center;color:#8b98ad;font-size:12.5px}
@media (prefers-reduced-motion:reduce){.af-chip{transition:none}.af-chip:hover{transform:none}}
</style>
<div class="arch-flow">
  <div class="af-row">
    <span class="af-user">用户需求</span>
    <span class="af-arrow"></span>
    <div class="af-chip">
      <div class="af-ico" style="background:linear-gradient(135deg,#2f6feb,#5b8ff5)">核</div>
      <div><div class="af-t">SafeLoop 主智能体</div><div class="af-s">理解需求 · 规划与调度</div></div>
    </div>
    <span class="af-sub">下发测试计划，启动闭环</span>
  </div>

  <div class="af-loop">
    <span class="af-loop-tag">↻ 多轮测试闭环 · 判别反馈驱动适应</span>
    <div class="af-row" style="justify-content:center">
      <div class="af-chip">
        <div class="af-ico" style="background:linear-gradient(135deg,#e6465f,#f97362)">红</div>
        <div><div class="af-t">红方测试员</div><div class="af-s">设计并逐轮调整测试问题</div></div>
      </div>
      <span class="af-arrow"></span>
      <div class="af-chip">
        <div class="af-ico" style="background:linear-gradient(135deg,#7556d8,#a78bfa)">T</div>
        <div><div class="af-t">被测大模型</div><div class="af-s">本地模型或在线 API 黑盒</div></div>
      </div>
      <span class="af-arrow"></span>
      <div class="af-chip">
        <div class="af-ico" style="background:linear-gradient(135deg,#b66a08,#eab308)">判</div>
        <div><div class="af-t">安全判别</div><div class="af-s">内容安全 + 目标推进双视角</div></div>
      </div>
    </div>
    <div class="af-back">
      <span class="af-back-line"></span>
      <span>反馈适应：保持 / 调整 / 更换策略 → 红方进入下一轮，直到预算用尽</span>
    </div>
  </div>

  <div class="af-row" style="justify-content:flex-end">
    <span class="af-sub">测试结束，完整轨迹交给独立评审</span>
    <span class="af-arrow green"></span>
    <div class="af-chip">
      <div class="af-ico" style="background:linear-gradient(135deg,#16875d,#34d899)">评</div>
      <div><div class="af-t">独立评审官</div><div class="af-s">闭环之外 · 只做最终裁决</div></div>
    </div>
  </div>

  <div class="af-note">红方提问 → 被测模型回答 → 安全判别逐轮分析 → 全程留痕 → 独立评审官最终裁决</div>
</div>
