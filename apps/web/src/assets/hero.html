<style>
.arch-svg text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.an-box{fill:rgba(255,255,255,.70)}
.an-t{font-size:13.5px;font-weight:600;fill:#172033}
.an-user{font-size:13px;font-weight:600;fill:#5b6880}
.an-lab{font-size:11px;fill:#67738a}
.an-e{stroke:#c9d6e6;stroke-width:1.8;fill:none}
.an-fb{stroke:rgba(47,111,235,.55);stroke-width:1.6;fill:none;stroke-dasharray:5 9;
  animation:anflow 1.6s linear infinite}
@keyframes anflow{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.an-fb{animation:none}}
</style>
<svg viewBox="0 0 860 228" width="100%" class="arch-svg">
  <defs>
    <marker id="anArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9fb3d1"/>
    </marker>
    <marker id="anArrowBlue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="rgba(47,111,235,.75)"/>
    </marker>
  </defs>

  <!-- 主线：用户需求 → 主智能体 → 红方 → 被测模型 → 安全判别 -->
  <circle cx="46" cy="70" r="4.5" fill="#2f6feb"/>
  <text x="58" y="75" class="an-user">用户需求</text>
  <path class="an-e" d="M124 70 H 146" marker-end="url(#anArrow)"/>

  <rect class="an-box" x="150" y="48" width="132" height="44" rx="10" stroke="#2f6feb" stroke-width="1.4"/>
  <circle cx="172" cy="70" r="10.5" fill="#2f6feb"/>
  <text x="172" y="74" text-anchor="middle" style="font-size:11px;font-weight:700" fill="#fff">核</text>
  <text x="190" y="75" class="an-t">主智能体</text>
  <path class="an-e" d="M282 70 H 316" marker-end="url(#anArrow)"/>

  <rect class="an-box" x="320" y="48" width="106" height="44" rx="10" stroke="#e6465f" stroke-width="1.4"/>
  <circle cx="342" cy="70" r="10.5" fill="#e6465f"/>
  <text x="342" y="74" text-anchor="middle" style="font-size:11px;font-weight:700" fill="#fff">红</text>
  <text x="360" y="75" class="an-t">红方测试员</text>
  <path class="an-e" d="M426 70 H 456" marker-end="url(#anArrow)"/>

  <rect class="an-box" x="460" y="48" width="122" height="44" rx="10" stroke="#7556d8" stroke-width="1.4"/>
  <circle cx="482" cy="70" r="10.5" fill="#7556d8"/>
  <text x="482" y="74" text-anchor="middle" style="font-size:11px;font-weight:700" fill="#fff">T</text>
  <text x="500" y="75" class="an-t">被测大模型</text>
  <path class="an-e" d="M582 70 H 612" marker-end="url(#anArrow)"/>

  <rect class="an-box" x="616" y="48" width="106" height="44" rx="10" stroke="#b66a08" stroke-width="1.4"/>
  <circle cx="638" cy="70" r="10.5" fill="#b66a08"/>
  <text x="638" y="74" text-anchor="middle" style="font-size:11px;font-weight:700" fill="#fff">判</text>
  <text x="656" y="75" class="an-t">安全判别</text>

  <!-- 反馈回路：安全判别 → 红方（虚线弧，流动） -->
  <path class="an-fb" d="M 669 92 C 669 146, 375 146, 375 94" marker-end="url(#anArrowBlue)"/>
  <text x="522" y="138" text-anchor="middle" class="an-lab">反馈适应 · 逐轮调整策略</text>

  <!-- 闭环外：完整轨迹 → 独立评审官 -->
  <path d="M 700 92 V 168" stroke="#16875d" stroke-width="1.6" fill="none"
        stroke-dasharray="4 5" opacity=".65" marker-end="url(#anArrowGreen)"/>
  <defs>
    <marker id="anArrowGreen" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="rgba(22,135,93,.75)"/>
    </marker>
  </defs>
  <text x="712" y="134" class="an-lab">完整轨迹</text>
  <rect class="an-box" x="560" y="172" width="196" height="40" rx="10" stroke="#16875d" stroke-width="1.4"/>
  <circle cx="582" cy="192" r="10.5" fill="#16875d"/>
  <text x="582" y="196" text-anchor="middle" style="font-size:11px;font-weight:700" fill="#fff">评</text>
  <text x="600" y="197" class="an-t">独立评审官 · 最终裁决</text>
</svg>
<div style="text-align:center;color:#8b98ad;font-size:12.5px;padding:2px 0 10px">
  红方提问 → 被测模型回答 → 安全判别逐轮分析 · 反馈驱动下一轮 · 评审官永远在闭环之外</div>
