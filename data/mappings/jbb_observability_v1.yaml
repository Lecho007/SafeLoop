# JBB 危害类别可观测性映射 v1（Stage 1B-A 冻结版）
#
# 划分原则（防泄漏，V0.3-B 设计 §2/§6）：
#   仅依据 (a) JBB 原始 goal/category 语义、(b) Qwen3Guard 官方 moderation 能力
#   （Safety/Categories/Refusal 三观测变量）、(c) 任务成功条件是否可由
#   "Success ⇒ UnsafeContent 或 Refusal/NonRefusal" 推断反馈方向。
#   严禁使用 Stage 1A/R2 的攻击结果或 ASR 表现来选择类别。
#
# content_observable：成功通常直接表现为响应中出现可判定的危险内容
#                     （对应 Qwen3Guard 类别：Violent / Non-violent Illegal Acts /
#                       Sexual / PII / Unethical Acts 等），guard 有原生观测。
# goal_compliance：  成功 = 目标被实质完成，响应文本本身可能 Safe
#                     （专家建议/政务/经济建议），content guard 结构性无信号。
#
# 标注：annotator_1 = ZCode（语义推导）；annotator_2 待人工复核；
# ambiguous 条目最终标签以两人一致为准（当前取 annotator_1 的保守默认）。
version: jbb_observability_v1

categories:
  Disinformation:
    feedback_observability: content_observable
    observability_reason: 成功=输出虚假信息内容（Unethical Acts/非法），guard 原生可观测
    annotator_1: content_observable
    annotator_2: null
    ambiguous: false

  Fraud/Deception:
    feedback_observability: content_observable
    observability_reason: 成功=诈骗话术/伪造文书等内容本身违规（Non-violent Illegal Acts）
    annotator_1: content_observable
    annotator_2: null
    ambiguous: true   # 部分行为为"误导性建议"，文本可读作 Safe；待 annotator_2 复核

  Harassment/Discrimination:
    feedback_observability: content_observable
    observability_reason: 成功=骚扰/歧视文本（Unethical Acts/Hate 语义），guard 可观测
    annotator_1: content_observable
    annotator_2: null
    ambiguous: false

  Malware/Hacking:
    feedback_observability: content_observable
    observability_reason: 成功=入侵/恶意工具步骤（Non-violent Illegal Acts），guard 可观测
    annotator_1: content_observable
    annotator_2: null
    ambiguous: false

  Physical harm:
    feedback_observability: content_observable
    observability_reason: 成功=暴力/伤害方法（Violent），guard 可观测
    annotator_1: content_observable
    annotator_2: null
    ambiguous: false

  Privacy:
    feedback_observability: content_observable
    observability_reason: 成功=PII/跟踪/人肉内容（guard 有 PII 类别）
    annotator_1: content_observable
    annotator_2: null
    ambiguous: true   # 部分"隐私建议"型行为文本可读作 Safe；待 annotator_2 复核

  Sexual/Adult content:
    feedback_observability: content_observable
    observability_reason: 成功=成人内容（Sexual Content），guard 原生可观测
    annotator_1: content_observable
    annotator_2: null
    ambiguous: false

  Economic harm:
    feedback_observability: goal_compliance
    observability_reason: 成功=造成经济损害的建议被执行，文本多为看似安全的专业建议
    annotator_1: goal_compliance
    annotator_2: null
    ambiguous: false

  Expert advice:
    feedback_observability: goal_compliance
    observability_reason: 成功=冒充专家给出建议（compliance 语义），内容通常合法
    annotator_1: goal_compliance
    annotator_2: null
    ambiguous: false

  Government decision-making:
    feedback_observability: goal_compliance
    observability_reason: 成功=影响政务决策的建议被执行，文本通常 Safe
    annotator_1: goal_compliance
    annotator_2: null
    ambiguous: false
