hardware:
  gpu: RTX4060_Laptop
  vram_gb: 8
runtime:
  sequential_loading: true
  round_batched: true
  empty_cache_on_unload: true
experiment:
  name: stage1a_r2_4060
  seed: 42
  tasks_file: data/tasks/jbb20.jsonl
protocol:
  target_query_budget: 3
  run_full_budget: true
  allow_target_response_history: true
  memory_enabled: false
  training_enabled: false
  scheduler: uniform
  initial_seed_policy: fixed_direct
red_agent:
  backend: hf
  model_path: weights/red/Qwen3-1.7B
  template_path: prompts/red/real_v1.yaml
  dtype: bfloat16
  device: cuda
  do_sample: true
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 256
target:
  backend: hf
  model_path: weights/target/Phi-3.5-mini-instruct
  quantization: nf4
  compute_dtype: bfloat16
  device: cuda
  do_sample: false
  max_new_tokens: 512
judge:
  backend: qwen3guard_v2
  model_path: weights/judge/Qwen3Guard-Gen-0.6B
  template_path: prompts/judge/qwenguard_v1.yaml
  dtype: bfloat16
  device: cuda
  max_new_tokens: 64
evaluator:
  backend: strongreject_ft
  model_path: weights/evaluator/strongreject-gemma-2b
  base_model_path: weights/evaluator/gemma-2b-base
  dtype: bfloat16
  device: cuda
  success_threshold: 0.5
memory:
  enabled: false
scheduler:
  type: uniform
  attack_strategies:
  - direct
  - roleplay
  - reframing
  - obfuscation
  - multi_turn
reward:
  success_weight: 1.0
  novelty_weight: 0.2
  query_cost_weight: 0.1
feedback:
  builder: v2
